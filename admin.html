<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>לוח ניהול | צ'יבורשקה בישראל</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark: #0f1117;
      --bg-card: #1a1d27;
      --bg-sidebar: #13151f;
      --accent: #6c63ff;
      --accent-hover: #5a52e0;
      --text-primary: #f0f0f5;
      --text-secondary: #9b9bb5;
      --border: #2a2d3e;
      --row-alt: #1e2130;
      --success: #22c55e;
      --error: #ef4444;
      --stat-1: #6c63ff;
      --stat-2: #06b6d4;
      --stat-3: #f59e0b;
      --stat-4: #22c55e;
    }

    body {
      font-family: 'Rubik', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ===== LOGIN ===== */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f1117 0%, #1a1025 100%);
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo .emoji {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
    }

    .login-logo h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.4;
    }

    .login-logo span {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-align: right;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: 'Rubik', sans-serif;
      font-size: 14px;
      direction: ltr;
      text-align: left;
      transition: border-color 0.2s;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .form-group input::placeholder {
      color: #444;
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Rubik', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 16px;
      text-align: center;
      display: none;
    }

    .success-msg {
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.3);
      color: #4ade80;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 8px;
      text-align: center;
      display: none;
    }

    /* ===== DASHBOARD ===== */
    #dashboard-screen { display: none; }

    .top-nav {
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .nav-title .dot {
      color: var(--accent);
    }

    .source-filter {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .source-filter label {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    select {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: 'Rubik', sans-serif;
      font-size: 13px;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      outline: none;
      direction: rtl;
      transition: border-color 0.2s;
    }

    select:focus { border-color: var(--accent); }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: 'Rubik', sans-serif;
      font-size: 13px;
      padding: 7px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-logout:hover {
      border-color: var(--error);
      color: #f87171;
    }

    .main-content {
      padding: 32px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ===== STATS ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 500px) {
      .stats-grid { grid-template-columns: 1fr; }
      .main-content { padding: 16px; }
      .top-nav { padding: 0 16px; }
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 4px;
      height: 100%;
      border-radius: 0 12px 12px 0;
    }

    .stat-card:nth-child(1)::before { background: var(--stat-1); }
    .stat-card:nth-child(2)::before { background: var(--stat-2); }
    .stat-card:nth-child(3)::before { background: var(--stat-3); }
    .stat-card:nth-child(4)::before { background: var(--stat-4); }

    .stat-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
      direction: ltr;
      text-align: right;
    }

    .stat-card:nth-child(1) .stat-value { color: var(--stat-1); }
    .stat-card:nth-child(2) .stat-value { color: var(--stat-2); }
    .stat-card:nth-child(3) .stat-value { color: var(--stat-3); }
    .stat-card:nth-child(4) .stat-value { color: var(--stat-4); }

    /* ===== SECTIONS ===== */
    .section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .section-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .section-sub {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* ===== TABLE ===== */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      background: rgba(255,255,255,0.03);
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 24px;
      text-align: right;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 14px 24px;
      color: var(--text-primary);
      border-bottom: 1px solid rgba(42,45,62,0.5);
    }

    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) td { background: var(--row-alt); }
    tr:hover td { background: rgba(108,99,255,0.06); }

    td.ltr-data {
      direction: ltr;
      text-align: left;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: var(--text-secondary);
    }

    td.email-cell {
      direction: ltr;
      text-align: left;
      font-size: 13px;
    }

    /* ===== PAGINATION ===== */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
    }

    .page-btn {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: 'Rubik', sans-serif;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .page-btn:hover { border-color: var(--accent); color: var(--accent); }
    .page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .page-info {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ===== EMAIL EDITOR ===== */
    .email-editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 24px;
    }

    @media (max-width: 700px) {
      .email-editor-grid { grid-template-columns: 1fr; }
    }

    .editor-field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .editor-field textarea {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: 'Rubik', sans-serif;
      font-size: 14px;
      padding: 12px 16px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.6;
    }

    .editor-field textarea:focus { border-color: var(--accent); }

    .editor-actions {
      padding: 0 24px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-save {
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: 'Rubik', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-save:hover { background: var(--accent-hover); }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ===== LOADING ===== */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: var(--text-secondary);
      font-size: 14px;
      gap: 10px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .two-col {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .two-col { grid-template-columns: 1fr; }
    }

    .badge {
      display: inline-block;
      background: rgba(108,99,255,0.15);
      color: #a89fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
      font-size: 14px;
    }
  </style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <span class="emoji">🐻</span>
      <h1>לוח ניהול</h1>
      <span>צ'יבורשקה בישראל</span>
    </div>
    <div class="form-group">
      <label>כתובת מייל</label>
      <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email" />
    </div>
    <div class="form-group">
      <label>סיסמה</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">התחברות</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- ==================== DASHBOARD ==================== -->
<div id="dashboard-screen">
  <!-- Top Nav -->
  <nav class="top-nav">
    <div class="nav-left">
      <div class="nav-title">לוח ניהול <span class="dot">|</span> צ'יבורשקה בישראל</div>
      <div class="source-filter">
        <label>סינון:</label>
        <select id="source-filter" onchange="onSourceChange()">
          <option value="">כל הקמפיינים</option>
        </select>
      </div>
    </div>
    <button class="btn-logout" onclick="doLogout()">התנתק</button>
  </nav>

  <!-- Content -->
  <div class="main-content">

    <!-- Stats -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="stat-label">סה"כ לידים</div>
        <div class="stat-value" id="stat-leads">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">ממוצע זמן בדף</div>
        <div class="stat-value" id="stat-time">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">לחיצות כפתור הרשמה</div>
        <div class="stat-value" id="stat-clicks">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">אחוז המרה</div>
        <div class="stat-value" id="stat-conversion">—</div>
      </div>
    </div>

    <!-- Leads + Analytics -->
    <div class="two-col">
      <!-- Leads Table -->
      <div class="section">
        <div class="section-header">
          <div class="section-title">לידים</div>
          <div class="section-sub" id="leads-count-label">טוען...</div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>מייל</th>
                <th>מקור</th>
                <th>תאריך</th>
              </tr>
            </thead>
            <tbody id="leads-tbody">
              <tr><td colspan="3"><div class="loading"><div class="spinner"></div> טוען לידים...</div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="leads-pagination"></div>
      </div>

      <!-- Analytics Breakdown -->
      <div class="section">
        <div class="section-header">
          <div class="section-title">פירוט אירועים</div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>סוג אירוע</th>
                <th>כמות</th>
              </tr>
            </thead>
            <tbody id="analytics-tbody">
              <tr><td colspan="2"><div class="loading"><div class="spinner"></div> טוען...</div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Email Template Editor -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">עורך תבנית מייל ברוכים הבאים</div>
        <div class="section-sub">ערוך את מייל הברכה שנשלח ללידים חדשים</div>
      </div>
      <div class="email-editor-grid">
        <div class="editor-field">
          <label>נושא המייל (Subject)</label>
          <textarea id="email-subject" rows="3" placeholder="נושא המייל..."></textarea>
        </div>
        <div class="editor-field">
          <label>תוכן המייל (Body)</label>
          <textarea id="email-body" rows="3" placeholder="תוכן המייל..."></textarea>
        </div>
      </div>
      <div class="editor-actions">
        <button class="btn-save" onclick="saveEmailTemplate()">שמור שינויים</button>
        <div class="error-msg" id="email-error" style="margin-top:0;"></div>
        <div class="success-msg" id="email-success" style="margin-top:0;"></div>
      </div>
    </div>

  </div><!-- /main-content -->
</div><!-- /dashboard-screen -->

<script>
  const SUPABASE_URL = 'https://uaspcafukqvgiztzdnfu.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhc3BjYWZ1a3F2Z2l6dHpkbmZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3MTA1NzcsImV4cCI6MjA4NzI4NjU3N30.BOqlLF8TQ7VabhsOrSgXyoLIwHCZP8M-LRt7Ok6FbWE';

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ─── State ──────────────────────────────────────────
  let allLeads = [];
  let allAnalytics = [];
  let currentPage = 1;
  const PAGE_SIZE = 20;
  let currentSource = '';

  // ─── AUTH ────────────────────────────────────────────
  async function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('login-error');

    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'מתחבר...';

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      let msg = 'שגיאת התחברות. בדוק מייל וסיסמה.';
      if (error.message.includes('Invalid login')) msg = 'כתובת מייל או סיסמה שגויים.';
      else if (error.message.includes('Email not confirmed')) msg = 'האימייל לא אומת. בדוק את תיבת הדואר שלך.';
      else if (error.message.includes('Too many requests')) msg = 'יותר מדי ניסיונות. נסה שוב מאוחר יותר.';
      errEl.textContent = msg;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'התחברות';
    } else {
      showDashboard();
    }
  }

  async function doLogout() {
    await sb.auth.signOut();
    document.getElementById('dashboard-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('login-password').value = '';
  }

  document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  // ─── INIT ────────────────────────────────────────────
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      showDashboard();
    }
  })();

  async function showDashboard() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard-screen').style.display = 'block';
    await loadAll();
  }

  // ─── LOAD ALL DATA ───────────────────────────────────
  async function loadAll() {
    await Promise.all([
      loadLeads(),
      loadAnalytics(),
      loadSettings(),
    ]);
  }

  // ─── LEADS ───────────────────────────────────────────
  async function loadLeads() {
    const { data, error } = await sb
      .from('leads')
      .select('id, email, source, created_at')
      .order('created_at', { ascending: false });

    if (error) {
      console.error('Leads error:', error);
      document.getElementById('leads-tbody').innerHTML =
        '<tr><td colspan="3" class="empty-state">שגיאה בטעינת לידים</td></tr>';
      return;
    }

    allLeads = data || [];
    populateSourceFilter(allLeads);
    renderLeads();
    updateStats();
  }

  function populateSourceFilter(leads) {
    const sources = [...new Set(leads.map(l => l.source).filter(Boolean))].sort();
    const sel = document.getElementById('source-filter');
    // Keep first option
    while (sel.options.length > 1) sel.remove(1);
    sources.forEach(src => {
      const opt = document.createElement('option');
      opt.value = src;
      opt.textContent = src;
      sel.appendChild(opt);
    });
  }

  function filteredLeads() {
    if (!currentSource) return allLeads;
    return allLeads.filter(l => l.source === currentSource);
  }

  function renderLeads() {
    const leads = filteredLeads();
    const totalPages = Math.max(1, Math.ceil(leads.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = 1;

    const start = (currentPage - 1) * PAGE_SIZE;
    const page = leads.slice(start, start + PAGE_SIZE);

    const tbody = document.getElementById('leads-tbody');
    document.getElementById('leads-count-label').textContent =
      leads.length + ' לידים סה"כ';

    if (leads.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3"><div class="empty-state">אין לידים להצגה</div></td></tr>';
      document.getElementById('leads-pagination').innerHTML = '';
      return;
    }

    tbody.innerHTML = page.map(l => {
      const date = new Date(l.created_at);
      const dateStr = date.toLocaleDateString('he-IL', { day:'2-digit', month:'2-digit', year:'numeric' });
      const timeStr = date.toLocaleTimeString('he-IL', { hour:'2-digit', minute:'2-digit' });
      return `
        <tr>
          <td class="email-cell">${escHtml(l.email || '—')}</td>
          <td>${l.source ? '<span class="badge">' + escHtml(l.source) + '</span>' : '<span style="color:var(--text-secondary)">—</span>'}</td>
          <td class="ltr-data">${dateStr} ${timeStr}</td>
        </tr>`;
    }).join('');

    renderPagination(leads.length, totalPages);
  }

  function renderPagination(total, totalPages) {
    const container = document.getElementById('leads-pagination');
    if (totalPages <= 1) { container.innerHTML = ''; return; }

    let html = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>&#8250; הקודם</button>`;

    // Show up to 7 page buttons
    const range = pageRange(currentPage, totalPages);
    range.forEach(p => {
      if (p === '...') {
        html += `<span style="color:var(--text-secondary);padding:0 4px">...</span>`;
      } else {
        html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
      }
    });

    html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>הבא &#8249;</button>`;
    html += `<span class="page-info">עמוד ${currentPage} מתוך ${totalPages}</span>`;
    container.innerHTML = html;
  }

  function pageRange(current, total) {
    if (total <= 7) return Array.from({length: total}, (_, i) => i + 1);
    if (current <= 4) return [1,2,3,4,5,'...',total];
    if (current >= total - 3) return [1,'...',total-4,total-3,total-2,total-1,total];
    return [1,'...',current-1,current,current+1,'...',total];
  }

  function goPage(p) {
    currentPage = p;
    renderLeads();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ─── ANALYTICS ───────────────────────────────────────
  async function loadAnalytics() {
    const { data, error } = await sb
      .from('analytics_events')
      .select('event_type, event_data, source, created_at');

    if (error) {
      console.error('Analytics error:', error);
      document.getElementById('analytics-tbody').innerHTML =
        '<tr><td colspan="2" class="empty-state">שגיאה בטעינת נתונים</td></tr>';
      return;
    }

    allAnalytics = data || [];
    renderAnalytics();
    updateStats();
  }

  function filteredAnalytics() {
    if (!currentSource) return allAnalytics;
    return allAnalytics.filter(e => e.source === currentSource);
  }

  function renderAnalytics() {
    const events = filteredAnalytics();
    const counts = {};
    events.forEach(e => {
      counts[e.event_type] = (counts[e.event_type] || 0) + 1;
    });

    const tbody = document.getElementById('analytics-tbody');
    const entries = Object.entries(counts).sort((a,b) => b[1] - a[1]);

    if (entries.length === 0) {
      tbody.innerHTML = '<tr><td colspan="2"><div class="empty-state">אין נתונים</div></td></tr>';
      return;
    }

    tbody.innerHTML = entries.map(([type, count]) =>
      `<tr>
        <td><span class="badge">${escHtml(type)}</span></td>
        <td style="font-weight:600;color:var(--accent)">${count.toLocaleString()}</td>
      </tr>`
    ).join('');
  }

  // ─── STATS ───────────────────────────────────────────
  function updateStats() {
    const leads = filteredLeads();
    const events = filteredAnalytics();

    // 1. Total leads
    document.getElementById('stat-leads').textContent = leads.length.toLocaleString();

    // 2. Avg time on page
    const timeEvents = events.filter(e => e.event_type === 'time_on_page');
    const times = timeEvents
      .map(e => {
        try { return parseInt(e.event_data?.seconds ?? e.event_data, 10); } catch { return NaN; }
      })
      .filter(n => !isNaN(n) && n > 0);
    const avgTime = times.length ? Math.round(times.reduce((a,b) => a+b, 0) / times.length) : null;
    document.getElementById('stat-time').textContent = avgTime !== null ? avgTime + ' שניות' : '—';

    // 3. Submit button clicks
    const clicks = events.filter(e =>
      e.event_type === 'button_click' &&
      (e.event_data?.button === 'submit' || e.event_data === 'submit')
    ).length;
    document.getElementById('stat-clicks').textContent = clicks.toLocaleString();

    // 4. Conversion rate
    const pageViews = events.filter(e => e.event_type === 'page_view').length;
    if (pageViews > 0) {
      const pct = ((leads.length / pageViews) * 100).toFixed(1);
      document.getElementById('stat-conversion').textContent = pct + '%';
    } else {
      document.getElementById('stat-conversion').textContent = '—';
    }
  }

  // ─── SOURCE FILTER ───────────────────────────────────
  function onSourceChange() {
    currentSource = document.getElementById('source-filter').value;
    currentPage = 1;
    renderLeads();
    renderAnalytics();
    updateStats();
  }

  // ─── SETTINGS / EMAIL TEMPLATE ───────────────────────
  async function loadSettings() {
    const { data, error } = await sb
      .from('settings')
      .select('key, value');

    if (error) {
      console.error('Settings error:', error);
      return;
    }

    const settings = {};
    (data || []).forEach(row => { settings[row.key] = row.value; });

    if (settings['welcome_email_subject'] !== undefined) {
      document.getElementById('email-subject').value = settings['welcome_email_subject'];
    }
    if (settings['welcome_email_body'] !== undefined) {
      document.getElementById('email-body').value = settings['welcome_email_body'];
    }
  }

  async function saveEmailTemplate() {
    const subject = document.getElementById('email-subject').value;
    const body = document.getElementById('email-body').value;
    const errEl = document.getElementById('email-error');
    const sucEl = document.getElementById('email-success');
    const btn = document.querySelector('.btn-save');

    errEl.style.display = 'none';
    sucEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'שומר...';

    try {
      const { error: e1 } = await sb
        .from('settings')
        .upsert({ key: 'welcome_email_subject', value: subject }, { onConflict: 'key' });

      const { error: e2 } = await sb
        .from('settings')
        .upsert({ key: 'welcome_email_body', value: body }, { onConflict: 'key' });

      if (e1 || e2) {
        throw new Error((e1 || e2).message);
      }

      sucEl.textContent = 'השינויים נשמרו בהצלחה!';
      sucEl.style.display = 'block';
      setTimeout(() => { sucEl.style.display = 'none'; }, 4000);
    } catch (err) {
      errEl.textContent = 'שגיאה בשמירה: ' + (err.message || 'נסה שוב.');
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'שמור שינויים';
    }
  }

  // ─── UTILS ───────────────────────────────────────────
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
